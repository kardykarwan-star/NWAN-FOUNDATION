<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وردەکاریی چالاکییەکان | NWAN FOUNDATION</title>

  <style>
    @font-face {
      font-family: 'K24 Kurdish';
      src: url('./K24KurdishBold-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --deep-teal: #005B60;
      --turquoise: #078F91;
      --gold: #C69A43;
      --light-bg: #F4F8F7;
      --text: #234447;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, button, a, h1, h2, h3, p, span {
      font-family: 'K24 Kurdish', sans-serif;
    }

    body {
      background: var(--light-bg);
      color: var(--text);
      line-height: 1.9;
    }

    a { text-decoration: none; }

    header {
      background: white;
      box-shadow: 0 3px 18px rgba(0,60,65,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1150px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand img {
      width: 65px;
      height: 65px;
      object-fit: contain;
    }

    .brand-name {
      color: var(--deep-teal);
      font-size: 20px;
      line-height: 1.4;
    }

    .brand-name span {
      display: block;
      color: var(--gold);
      font-size: 12px;
      direction: ltr;
      text-align: right;
    }

    nav { display: flex; align-items: center; gap: 25px; }
    nav a { color: var(--deep-teal); font-size: 14px; }
    nav a:hover { color: var(--gold); }

    .menu-btn {
      display: none;
      border: 0;
      background: var(--deep-teal);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .contact-nav {
      background: var(--gold);
      color: #183D3E;
      padding: 8px 16px;
      border-radius: 8px;
    }

    .page-heading {
      background: linear-gradient(135deg, #00494D, #078F91);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    .page-heading h1 { font-size: 32px; margin-bottom: 10px; }
    .page-heading p { color: #F0FAF9; font-size: 14px; }

    .section {
      max-width: 1150px;
      margin: auto;
      padding: 55px 24px 65px;
    }

    .section-title { text-align: center; margin-bottom: 35px; }

    .section-title h2 {
      color: var(--deep-teal);
      font-size: 27px;
    }

    .section-title span {
      display: block;
      width: 65px;
      height: 4px;
      background: var(--gold);
      border-radius: 5px;
      margin: 10px auto;
    }

    .section-title p { color: #617779; font-size: 14px; }

    .activities-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .activity-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,70,75,0.07);
      border: 1px solid #E0ECE9;
      transition: 0.3s;
    }

    .activity-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 35px rgba(0,70,75,0.13);
    }

    .activity-image {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #E5F3F1;
    }

    .activity-info { padding: 24px; text-align: center; }

    .activity-info h2 {
      color: var(--deep-teal);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .activity-date {
      display: inline-block;
      color: #8B6A2F;
      background: #F8F1E3;
      padding: 4px 13px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 13px;
    }

    .activity-info p {
      color: #617779;
      font-size: 14px;
      text-align: justify;
    }

    .empty-message {
      background: white;
      border: 1px solid #E0ECE9;
      border-radius: 18px;
      padding: 35px 22px;
      text-align: center;
      color: #617779;
      box-shadow: 0 8px 30px rgba(0,70,75,0.05);
    }

    .empty-message .empty-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
    }

    .back-home {
      display: inline-block;
      margin-top: 30px;
      background: var(--gold);
      color: #183D3E;
      padding: 10px 25px;
      border-radius: 9px;
    }

    footer {
      background: #003F43;
      color: #E7F1EF;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
    }

    footer strong { color: #E2BC6D; }

    @media (max-width: 760px) {
      .navbar { flex-wrap: wrap; }
      .menu-btn { display: block; }

      nav {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
      }

      nav.active { display: flex; }

      nav a {
        padding: 10px;
        border-top: 1px solid #E8F0EF;
      }

      .activities-grid { grid-template-columns: 1fr; }
      .section { padding: 40px 18px 50px; }
      .page-heading h1 { font-size: 26px; }
      .activity-image { height: 220px; }
    }
  </style>
</head>

<body>
<header>
  <div class="navbar">
    <a href="index.html" class="brand">
      <img src="file_00000000224c8246a91218ab6ae16654.png" alt="لۆگۆی بنیاتی نوان">
      <div class="brand-name">
        بنیاتی نوان
        <span>NWAN FOUNDATION</span>
      </div>
    </a>

    <button class="menu-btn" onclick="toggleMenu()">☰ پەڕەکان</button>

    <nav id="navigation">
      <a href="index.html">سەرەکی</a>
      <a href="index.html#about">دەربارەی ئێمە</a>
      <a href="activities.html">چالاکییەکان</a>
      <a href="index.html#values">بەهاکانمان</a>
      <a href="contact.html" class="contact-nav">پەیوەندی کردن</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-heading">
    <h1 id="categoryTitle">چالاکییەکان</h1>
    <p id="categoryDescription">چالاکی و هەوڵەکانی بنیاتی نوان</p>
  </section>

  <section class="section">
    <div class="section-title">
      <h2 id="sectionTitle">چالاکییەکانمان</h2>
      <span></span>
      <p>وردەکاریی چالاکییە ئەنجامدراوەکانمان لەم بەشەدا ببینە.</p>
    </div>

    <div class="activities-grid" id="activitiesList"></div>

    <div style="text-align:center;">
      <a href="activities.html" class="back-home">گەڕانەوە بۆ بوارەکانی چالاکییەکان</a>
    </div>
  </section>
</main>

<footer>
  <p>© 2026 <strong>NWAN FOUNDATION</strong> - هەموو مافەکان پارێزراون.</p>
</footer>

<script>
  function toggleMenu() {
    document.getElementById("navigation").classList.toggle("active");
  }

  const activities = {
    environment: {
      title: "🌳 ژینگەدۆستی",
      description: "پاراستنی ژینگە و پاک و جوان ڕاگرتنی شوێنە گشتییەکان",
      items: [
        {
          title: "هەڵمەتی پاککردنەوە",
          date: "٢١/٣/٢٠٢٦",
          image: "FB_IMG_1793805664782.jpg",
          description: "لە ڕێکەوتی ٢١/٣/٢٠٢٦، بە هاوبەشیی دەزگای ئاسایشی هەرێمی کوردستان و بەشداریی چین و توێژە فەرمی و نافەرمییەکان، هەڵمەتی پاککردنەوەی هەرەوەزی کوردستانمان ئەنجام دا، بە ئامانجی پاراستنی ژینگە و جوانکردنی شوێنە گشتییەکان."
        },
        {
          title: "پاککردنەوەی چەمچەماڵ",
          date: "٩/١٢/٢٠٢٥",
          image: "file_0000000011188211830ca8fe507bd585.png",
          description: "چالاکیی پاککردنەوەی چەمچەماڵ و هاوکاریی زیانلێکەوتووانی لافاو، بە مەبەستی پاراستنی ژینگە و پشتیوانیی خەڵکی زیانلێکەوتوو."
        }
      ]
    },

    culture: {
      title: "نیشتمانی و کەلتووری",
      description: "پاراستن و زیندوو ڕاگرتنی ناسنامە و هێما نیشتمانییەکان",
      items: [
        {
          title: "ئاڵای کوردستان",
          date: "١٧/١٢/٢٠٢٥",
          image: "Screenshot_20261104_190752_Instagram.jpg",
          description: "هەڵمەتی نوێکردنەوە و بەرزکردنەوەی ئاڵای کوردستان لە سەرانسەری هەرێمی کوردستان، بە مەبەستی زیندوو ڕاگرتنی هێما و ناسنامەی نیشتمانی."
        }
      ]
    },

    education: {
      title: "پەروەردە و خوێندن",
      description: "پشتگیریی قوتابیان و ئاسانکردنی ڕێگای خوێندن",
      items: [
        {
          title: "پێویستی قوتابی",
          date: "١/١٠/٢٠٢٦",
          image: "Screenshot_20261104_191637_Instagram.jpg",
          description: "لە ڕێکەوتی ١/١٠/٢٠٢٦، تەواوی پێداویستییەکانی قوتابیمان بۆ سەدان قوتابی لە قوتابخانە بنەڕەتییەکانی کوردستان دابین کرد، بە ئامانجی ئاسانکردنی ڕێگای خوێندن و پشتگیریی قوتابیان."
        }
      ]
    },

    humanitarian: {
      title: "خێرخوازی و هاوکاری مرۆیی",
      description: "یارمەتیدانی خێزانە پێویستدارەکان و پشتگیریی مرۆیی",
      items: [
        {
          title: "سەبەتەی خۆراک",
          date: "١٠/٩/٢٠٢٦",
          image: "file_00000000926081f793b9ef4c19c541a8.png",
          description: "لە ڕۆژی ١٠/٩/٢٠٢٦، سەدان سەبەتەی خۆراکمان دابەش کرد بەسەر هاوڵاتیانی پێویستدار لە کوردستان، بۆ پشتگیریی خێزانەکان و دابینکردنی بەشێک لە پێداویستییە سەرەکییەکانیان."
        }
      ]
    },

    health: {
      title: "تەندروستی و هۆشیاری",
      description: "بەشداری لە چالاکییە تەندروستییەکان و یارمەتیدانی نەخۆشان",
      items: [
        {
          title: "خوێنبەخشین",
          date: "١٤/٩/٢٠٢٦",
          image: "IMG_7acd4d2f-c18b-4716-9998-987e05c69a35.jpg",
          description: "لە ڕێکەوتی ١٤/٩/٢٠٢٦، چالاکییەکی خوێنبەخشینمان ئەنجام دا، بە مەبەستی دابینکردنی خوێنی پێویست و یارمەتیدانی نەخۆشانی پێویستدار بە خوێن."
        }
      ]
    },

    social: {
      title: "پشتگیریی کۆمەڵایەتی",
      description: "گرنگیدان بە منداڵان، کەسانی بەساڵاچوو و چینە پێویستدارەکان",
      items: []
    },

    youth: {
      title: "گەنجان و گەشەپێدانی کۆمەڵگە",
      description: "ڕاهێنان، بەشداری و پەرەپێدانی تواناکانی گەنجان",
      items: []
    }
  };

  const params = new URLSearchParams(window.location.search);
  const type = params.get("type");
  const category = activities[type];

  const titleElement = document.getElementById("categoryTitle");
  const descriptionElement = document.getElementById("categoryDescription");
  const sectionTitle = document.getElementById("sectionTitle");
  const list = document.getElementById("activitiesList");

  if (!category) {
    titleElement.textContent = "بوارەکە نەدۆزرایەوە";
    descriptionElement.textContent = "تکایە بگەڕێوە و یەکێک لە بوارەکان هەڵبژێرە.";
    sectionTitle.textContent = "بوارە بەردەستەکان";
    list.innerHTML = `
      <div class="empty-message">
        <span class="empty-icon">🔎</span>
        تکایە لە پەڕەی چالاکییەکانەوە بوارێکی دروست هەڵبژێرە.
      </div>
    `;
  } else {
    titleElement.textContent = category.title;
    descriptionElement.textContent = category.description;
    sectionTitle.textContent = "چالاکییەکانی " + category.title;

    if (category.items.length === 0) {
      list.innerHTML = `
        <div class="empty-message">
          <span class="empty-icon">🌱</span>
          <h3>بەم زووانە چالاکییەکانمان لەم بوارەدا زیاد دەکەین</h3>
          <p>سوپاس بۆ سەردانت. تکایە دواتر سەردانی ئەم بەشە بکەرەوە.</p>
        </div>
      `;
    } else {
      category.items.forEach((activity) => {
        const card = document.createElement("article");
        card.className = "activity-card";

        const image = document.createElement("img");
        image.className = "activity-image";
        image.src = activity.image;
        image.alt = activity.title;
        image.loading = "lazy";

        const info = document.createElement("div");
        info.className = "activity-info";

        const heading = document.createElement("h2");
        heading.textContent = activity.title;

        const date = document.createElement("span");
        date.className = "activity-date";
        date.textContent = activity.date;

        const paragraph = document.createElement("p");
        paragraph.textContent = activity.description;

        info.append(heading, date, paragraph);
        card.append(image, info);
        list.appendChild(card);
      });
    }
  }
</script>
</body>
</html>
